<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring - Yusuf Dharma</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- SheetJS (XLSX Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #020617; /* Slate 950 */
            --bg-card: rgba(15, 23, 42, 0.6);
            --accent-primary: #3b82f6; /* Blue 500 */
            --accent-secondary: #8b5cf6; /* Violet 500 */
        }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        /* Glassmorphism */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Tabs */
        .main-tab { transition: all 0.3s ease; }
        .main-tab.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border-bottom: 2px solid #60a5fa;
            color: white;
        }

        /* Collector Tabs */
        .coll-tab { transition: all 0.2s ease; }
        .coll-tab.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8 antialiased">

    <div class="max-w-[1600px] mx-auto space-y-6">

        <!-- HEADER -->
        <header class="glass-panel p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-chart-pie text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-violet-400">
                        Selamat Datang, Yusuf Dharma Mu'minin
                    </h1>
                    <p class="text-sm text-slate-400 mt-1 font-medium">Dashboard Pengelola Monitoring Performa & Portofolio</p>
                </div>
            </div>

            <!-- Upload Area -->
            <div class="flex flex-col items-end">
                <label class="cursor-pointer group relative">
                    <div class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700 group-hover:border-blue-500/50 px-5 py-2.5 rounded-xl flex items-center gap-3 transition-all shadow-lg">
                        <i class="fa-solid fa-file-excel text-emerald-400 text-xl"></i>
                        <div class="text-left">
                            <div class="text-sm font-bold text-slate-200 group-hover:text-white">Upload Update Excel</div>
                            <div class="text-[10px] text-slate-400">Format: Workbook2_2.xlsx</div>
                        </div>
                    </div>
                    <input type="file" id="excel-upload" accept=".xlsx, .xls" class="hidden">
                </label>
                <div id="upload-status" class="text-xs text-emerald-400 mt-2 hidden flex items-center gap-1">
                    <i class="fa-solid fa-check-circle"></i> Data berhasil diperbarui
                </div>
            </div>
        </header>

        <!-- MAIN TABS (Sheet Navigation) -->
        <div class="flex items-center gap-2 overflow-x-auto border-b border-slate-800 pb-px" id="main-tabs-container">
            <!-- Tabs will be generated here dynamically -->
        </div>

        <!-- MAIN CONTENT AREA -->
        <div id="dashboard-content" class="min-h-[600px]">
            <!-- Dynamic content injected here -->
        </div>

    </div>

    <script>
        // Global State
        let workbookData = {
            sheets: [],       // Array of sheet names
            data: {},         // Data per sheet
            activeSheet: '',  // Currently selected sheet tab
            performa: {
                activeCollector: '' // Currently selected collector in Performa sheet
            }
        };

        // Chart instances for memory management
        let charts = {
            performaKPI: null,
            portfolioDonut: null
        };

        // Elements
        const fileInput = document.getElementById('excel-upload');
        const mainTabsContainer = document.getElementById('main-tabs-container');
        const dashboardContent = document.getElementById('dashboard-content');
        const uploadStatus = document.getElementById('upload-status');

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(number || 0);
        };
        const formatPercent = (number) => {
            return ((number || 0) * 100).toFixed(1) + '%';
        };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    workbookData.sheets = workbook.SheetNames;
                    workbookData.data = {};
                    
                    workbook.SheetNames.forEach(sheetName => {
                        // Baca sebagai JSON header standar
                        const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: null });
                        workbookData.data[sheetName] = sheetData;
                    });

                    if (workbookData.sheets.length > 0) {
                        workbookData.activeSheet = workbookData.sheets[0];
                        
                        // Show success message
                        uploadStatus.classList.remove('hidden');
                        setTimeout(() => uploadStatus.classList.add('hidden'), 4000);
                        
                        buildMainTabs();
                        renderActiveSheet();
                    }
                } catch (error) {
                    console.error("Error parsing Excel:", error);
                    alert("Gagal membaca file Excel. Pastikan format sesuai.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function buildMainTabs() {
            mainTabsContainer.innerHTML = '';
            workbookData.sheets.forEach(sheetName => {
                const btn = document.createElement('button');
                const isPerforma = sheetName.toLowerCase().includes('performa') || sheetName === workbookData.sheets[0];
                const icon = isPerforma ? 'fa-user-tie' : 'fa-users';
                
                btn.className = `main-tab px-6 py-3 rounded-t-xl text-sm font-bold text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap ${sheetName === workbookData.activeSheet ? 'active text-white' : ''}`;
                btn.innerHTML = `<i class="fa-solid ${icon}"></i> ${sheetName}`;
                btn.onclick = () => {
                    workbookData.activeSheet = sheetName;
                    buildMainTabs();
                    renderActiveSheet();
                };
                mainTabsContainer.appendChild(btn);
            });
        }

        function renderActiveSheet() {
            dashboardContent.innerHTML = ''; // Clear current
            
            // Hapus grafik lama
            if(charts.performaKPI) charts.performaKPI.destroy();
            if(charts.portfolioDonut) charts.portfolioDonut.destroy();

            const sheetName = workbookData.activeSheet;
            const data = workbookData.data[sheetName] || [];

            if (data.length === 0) {
                dashboardContent.innerHTML = `<div class="glass-panel p-10 text-center text-slate-400">Data kosong pada sheet ini.</div>`;
                return;
            }

            // DETEKSI JENIS SHEET: Performa (Sheet 1) vs Portofolio (Sheet 2,3,4)
            // Asumsi: Sheet performa memiliki kolom Total Insentif atau C1%
            const sampleRow = data[0];
            const keys = Object.keys(sampleRow).map(k => k.toLowerCase());
            const isPerforma = keys.some(k => k.includes('insentif') || k.includes('c1'));

            if (isPerforma) {
                renderSheetPerforma(data);
            } else {
                renderSheetPortofolio(data);
            }
        }

        // ==========================================
        // ==========================================
        function renderSheetPerforma(data) {
            // Dapatkan daftar Collector unik
            const collectorCol = getColName(data[0], ['nama collector', 'nama', 'collector', 'kolektor']);
            if(!collectorCol) {
                dashboardContent.innerHTML = `<div class="glass-panel p-6 text-red-400">Kolom Nama Collector tidak ditemukan.</div>`;
                return;
            }

            const collectors = data.filter(r => r[collectorCol]).map(r => r[collectorCol]);
            
            if(!workbookData.performa.activeCollector || !collectors.includes(workbookData.performa.activeCollector)) {
                workbookData.performa.activeCollector = collectors[0];
            }

            const activeCollData = data.find(r => r[collectorCol] === workbookData.performa.activeCollector);

            // Mapping Data Kolom Fleksibel
            const val = (keywords) => activeCollData[getColName(activeCollData, keywords)] || 0;
            const str = (keywords) => activeCollData[getColName(activeCollData, keywords)] || '-';

            const kpiData = {
                w1Pct: val(['c1%', 'w1%']), insW1: val(['ins c1', 'ins w1']),
                w2Pct: val(['c2%', 'w2%']), insW2: val(['ins c2', 'ins w2']),
                w3Pct: val(['c3%', 'w3%']), insW3: val(['ins c3', 'ins w3']),
                w4Pct: val(['c4%', 'w4%']), insW4: val(['ins c4', 'ins w4']),
                tbMotor: val(['tb motor', 'motor']),
                tbMobil: val(['tb mobil', 'mobil']),
                btc: val(['btc', 'sr']),
                totalInsentif: val(['total insentif', 'total']),
                absen: val(['absen', 'total absen']),
                botl: val(['botl', 'raport insentif']),
                keterangan: str(['keterangan', 'status']),
                nilai: str(['nilai', 'score']),
                raport: str(['raport', 'grade']),
                flow: val(['flow', 'flow kpi']),
                balance: val(['balance']),
                flowEver: val(['flow ever', 'ever'])
            };

            let html = `
                <div class="fade-in space-y-6">
                    <!-- Navigasi Nama Collector -->
                    <div class="glass-panel p-2 flex gap-2 overflow-x-auto custom-scrollbar">
                        ${collectors.map(c => `
                            <button onclick="changeCollector('${c}')" 
                                class="coll-tab px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap border border-slate-700 
                                ${c === workbookData.performa.activeCollector ? 'active' : 'text-slate-400 hover:bg-slate-800'}">
                                <i class="fa-solid fa-user-circle mr-1"></i> ${c}
                            </button>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <!-- Kiri: Total & Spesifik -->
                        <div class="lg:col-span-4 space-y-6 flex flex-col">
                            <!-- Card Total Insentif -->
                            <div class="glass-panel p-6 relative overflow-hidden group border-l-4 border-blue-500">
                                <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl group-hover:bg-blue-500/30 transition-all"></div>
                                <div class="relative z-10">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Insentif Bulanan</div>
                                        <div class="px-3 py-1 rounded-full text-[10px] font-bold ${kpiData.keterangan.toString().toLowerCase().includes('tidak') ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">
                                            ${kpiData.keterangan}
                                        </div>
                                    </div>
                                    <div class="text-3xl lg:text-4xl font-black text-white my-2">${formatRupiah(kpiData.totalInsentif)}</div>
                                    
                                    <div class="grid grid-cols-2 gap-4 mt-6">
                                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                            <div class="text-[10px] text-slate-400 mb-1">Nilai Akhir</div>
                                            <div class="text-lg font-bold text-blue-400">${kpiData.nilai}</div>
                                        </div>
                                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                            <div class="text-[10px] text-slate-400 mb-1">Raport</div>
                                            <div class="text-lg font-bold text-violet-400">${kpiData.raport}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Card Rincian Spesifik -->
                            <div class="glass-panel p-6 flex-1 flex flex-col justify-center">
                                <h3 class="text-sm font-bold text-slate-200 mb-4 flex items-center gap-2"><i class="fa-solid fa-list-check text-blue-400"></i> Rincian Insentif & Kehadiran</h3>
                                <div class="space-y-3">
                                    <div class="flex justify-between items-center p-3 bg-slate-800/40 rounded-lg border border-slate-700/50">
                                        <span class="text-xs text-slate-400"><i class="fa-solid fa-motorcycle w-5 text-center"></i> TB Motor</span>
                                        <span class="text-sm font-bold text-white">${formatRupiah(kpiData.tbMotor)}</span>
                                    </div>
                                    <div class="flex justify-between items-center p-3 bg-slate-800/40 rounded-lg border border-slate-700/50">
                                        <span class="text-xs text-slate-400"><i class="fa-solid fa-car w-5 text-center"></i> TB Mobil</span>
                                        <span class="text-sm font-bold text-white">${formatRupiah(kpiData.tbMobil)}</span>
                                    </div>
                                    <div class="flex justify-between items-center p-3 bg-slate-800/40 rounded-lg border border-slate-700/50">
                                        <span class="text-xs text-slate-400"><i class="fa-brands fa-btc w-5 text-center"></i> BTC / SR</span>
                                        <span class="text-sm font-bold text-white">${formatRupiah(kpiData.btc)}</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3 mt-2">
                                        <div class="p-3 bg-violet-900/20 rounded-lg border border-violet-500/20 text-center">
                                            <div class="text-[10px] text-violet-300/70 uppercase">Total Absen</div>
                                            <div class="text-lg font-bold text-violet-300">${kpiData.absen} <span class="text-[10px] font-normal">Hari</span></div>
                                        </div>
                                        <div class="p-3 bg-blue-900/20 rounded-lg border border-blue-500/20 text-center">
                                            <div class="text-[10px] text-blue-300/70 uppercase">Ins. BOTL</div>
                                            <div class="text-sm mt-1 font-bold text-blue-300">${formatRupiah(kpiData.botl)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Kanan: Weekly & Chart -->
                        <div class="lg:col-span-8 space-y-6">
                            <!-- Weekly Grid -->
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                ${[1,2,3,4].map(w => `
                                    <div class="glass-panel p-4 flex flex-col justify-between border-t-2 border-slate-600 hover:border-blue-400 transition-colors">
                                        <div class="text-xs font-semibold text-slate-400 mb-2">Weekly ${w} (C${w}%)</div>
                                        <div class="text-2xl font-black text-white">${formatPercent(kpiData[`w${w}Pct`])}</div>
                                        <div class="text-xs font-medium text-emerald-400 mt-1">${formatRupiah(kpiData[`insW${w}`])}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- KPI Chart -->
                            <div class="glass-panel p-6 h-[320px] flex flex-col">
                                <h3 class="text-sm font-bold text-slate-200 mb-4">Tren KPI: Flow, Balance, Flow Ever (%)</h3>
                                <div class="relative flex-1 w-full"><canvas id="performaChart"></canvas></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            dashboardContent.innerHTML = html;

            // Render Chart Performa
            setTimeout(() => {
                const ctx = document.getElementById('performaChart').getContext('2d');
                charts.performaKPI = new Chart(ctx, {
                    type: 'bar',
                    plugins: [ChartDataLabels],
                    data: {
                        labels: ['FLOW', 'BALANCE', 'FLOW EVER'],
                        datasets: [{
                            label: 'Pencapaian KPI (%)',
                            data: [(kpiData.flow*100), (kpiData.balance*100), (kpiData.flowEver*100)],
                            backgroundColor: [
                                'rgba(59, 130, 246, 0.8)', // Blue
                                'rgba(139, 92, 246, 0.8)', // Violet
                                'rgba(16, 185, 129, 0.8)'  // Emerald
                            ],
                            borderRadius: 6,
                            borderWidth: 1,
                            borderColor: 'rgba(255,255,255,0.1)'
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                color: '#fff',
                                anchor: 'end', align: 'top',
                                formatter: (val) => val.toFixed(1) + '%',
                                font: { weight: 'bold' }
                            }
                        },
                        scales: {
                            y: { max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                            x: { grid: { display: false }, ticks: { color: '#cbd5e1' } }
                        }
                    }
                });
            }, 50);
        }

        window.changeCollector = (name) => {
            workbookData.performa.activeCollector = name;
            renderActiveSheet();
        }

        // ==========================================
        // ==========================================
        function renderSheetPortofolio(data) {
            const cols = {
                coll: getColName(data[0], ['nama collector', 'collector', 'kolektor']),
                konsumen: getColName(data[0], ['nama konsumen', 'konsumen', 'nasabah', 'nama']),
                kontrak: getColName(data[0], ['no kontrak', 'kontrak', 'nomor']),
                tipe: getColName(data[0], ['tipe barang', 'tipe', 'barang', 'objek']),
                sipok: getColName(data[0], ['sipok', 'sisa pokok', 'piutang', 'sisa'])
            };

            // Get unique filter values
            const filterColls = [...new Set(data.map(r => r[cols.coll]).filter(Boolean))].sort();
            
            // Build UI Skeleton
            let html = `
                <div class="fade-in space-y-6">
                    <!-- Area Filter & Grafik -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        <!-- Left: Info & Filter -->
                        <div class="lg:col-span-8 space-y-6">
                            <!-- KPI Cards -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="glass-panel p-5 border-l-4 border-emerald-500">
                                    <div class="text-xs text-slate-400 font-semibold mb-1 uppercase tracking-widest">Total Kontrak (Sheet ini)</div>
                                    <div class="text-3xl font-black text-white" id="port-total-kontrak">0</div>
                                </div>
                                <div class="glass-panel p-5 border-l-4 border-blue-500">
                                    <div class="text-xs text-slate-400 font-semibold mb-1 uppercase tracking-widest">Total Sipok</div>
                                    <div class="text-3xl font-black text-blue-400" id="port-total-sipok">Rp 0</div>
                                </div>
                            </div>

                            <!-- Filters -->
                            <div class="glass-panel p-5">
                                <h3 class="text-sm font-bold text-slate-200 mb-4"><i class="fa-solid fa-filter text-slate-400 mr-2"></i>Filter Data Penanganan</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-[10px] text-slate-400 mb-1 uppercase font-semibold">Nama Collector</label>
                                        <select id="filter-coll" class="w-full bg-slate-900 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 focus:border-blue-500 focus:outline-none">
                                            <option value="ALL">-- Semua Collector --</option>
                                            ${filterColls.map(c => `<option value="${c}">${c}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-slate-400 mb-1 uppercase font-semibold">Tipe Barang</label>
                                        <select id="filter-tipe" class="w-full bg-slate-900 border border-slate-700 text-sm text-slate-200 rounded-lg p-2.5 focus:border-blue-500 focus:outline-none">
                                            <option value="ALL">-- Semua Tipe --</option>
                                            <option value="MOTOR">MOTOR</option>
                                            <option value="MOBIL">MOBIL</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Donut Chart -->
                        <div class="lg:col-span-4 glass-panel p-5 flex flex-col items-center justify-center">
                            <h3 class="text-sm font-bold text-slate-200 w-full mb-2">Beban Penanganan Akun / Collector</h3>
                            <div class="text-xs text-slate-400 w-full mb-4">Grafik proporsi jumlah kontrak per collector</div>
                            <div class="relative w-full h-[220px]">
                                <canvas id="portfolioChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Area Tabel -->
                    <div class="glass-panel overflow-hidden">
                        <div class="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                            <h3 class="text-sm font-bold text-white"><i class="fa-solid fa-table-list text-blue-400 mr-2"></i>Rincian Konsumen & Kontrak</h3>
                            <span class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400" id="table-row-count">Menampilkan 0 baris</span>
                        </div>
                        <div class="overflow-x-auto overflow-y-auto max-h-[500px] custom-scrollbar">
                            <table class="w-full text-left text-xs whitespace-nowrap">
                                <thead class="sticky top-0 bg-slate-900/95 backdrop-blur-sm z-10 text-slate-400 uppercase font-semibold border-b border-slate-700">
                                    <tr>
                                        <th class="p-4">No</th>
                                        <th class="p-4">Nama Collector</th>
                                        <th class="p-4">Nama Konsumen</th>
                                        <th class="p-4">No Kontrak</th>
                                        <th class="p-4">Tipe Barang</th>
                                        <th class="p-4 text-right">Sipok (Sisa Pokok)</th>
                                    </tr>
                                </thead>
                                <tbody id="portfolio-table-body" class="divide-y divide-slate-800">
                                    <!-- Rows JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            dashboardContent.innerHTML = html;

            // Bind Events
            document.getElementById('filter-coll').addEventListener('change', () => filterAndRenderPortfolio(data, cols));
            document.getElementById('filter-tipe').addEventListener('change', () => filterAndRenderPortfolio(data, cols));

            // Initial Render
            filterAndRenderPortfolio(data, cols);
        }

        function filterAndRenderPortfolio(allData, cols) {
            const fColl = document.getElementById('filter-coll').value;
            const fTipe = document.getElementById('filter-tipe').value;

            // 1. Filter Data
            const filteredData = allData.filter(row => {
                const rColl = row[cols.coll] || '';
                const rTipe = (row[cols.tipe] || '').toString().toUpperCase();
                
                const matchColl = fColl === 'ALL' || rColl === fColl;
                let matchTipe = true;
                if(fTipe !== 'ALL') {
                    matchTipe = rTipe.includes(fTipe); // Handle cases like "MOBIL BEKAS"
                }
                
                return matchColl && matchTipe && rColl !== ''; // pastikan baris valid
            });

            // 2. Update KPI
            const totalSipok = filteredData.reduce((acc, row) => acc + (parseFloat(row[cols.sipok]) || 0), 0);
            document.getElementById('port-total-kontrak').innerText = filteredData.length;
            document.getElementById('port-total-sipok').innerText = formatRupiah(totalSipok);
            document.getElementById('table-row-count').innerText = `Menampilkan ${filteredData.length} baris`;

            // 3. Update Table
            const tbody = document.getElementById('portfolio-table-body');
            tbody.innerHTML = filteredData.map((r, i) => {
                const isMobil = (r[cols.tipe]||'').toString().toUpperCase().includes('MOBIL');
                const badgeClass = isMobil ? 'bg-pink-500/20 text-pink-300 border-pink-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30';
                
                return `
                <tr class="hover:bg-slate-800/50 transition-colors">
                    <td class="p-4 text-slate-500 font-medium">${i+1}</td>
                    <td class="p-4 font-bold text-slate-200">${r[cols.coll] || '-'}</td>
                    <td class="p-4 font-semibold text-white">${r[cols.konsumen] || '-'}</td>
                    <td class="p-4 font-mono text-slate-400">${r[cols.kontrak] || '-'}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-bold border ${badgeClass}">${r[cols.tipe] || '-'}</span></td>
                    <td class="p-4 text-right font-bold text-emerald-400">${formatRupiah(r[cols.sipok])}</td>
                </tr>
            `}).join('');
            if(filteredData.length === 0) tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Tidak ada data ditemukan sesuai filter.</td></tr>`;

            // 4. Update Chart (Hanya update data jika tidak ada filter Collector spesifik, agar chart tetap perbandingan global)
            // Atau update berdasarkan filter (bebas). Kita buat selalu update berdasarkan filter tipe, tp agg per collector
            
            const chartDataToAgg = fColl === 'ALL' ? filteredData : allData.filter(row => {
                const rTipe = (row[cols.tipe] || '').toString().toUpperCase();
                return fTipe === 'ALL' || rTipe.includes(fTipe);
            });

            const agg = {};
            chartDataToAgg.forEach(r => {
                const c = r[cols.coll];
                if(c) agg[c] = (agg[c] || 0) + 1;
            });

            const sortedAgg = Object.entries(agg).sort((a,b) => b[1] - a[1]);
            // Limit to top 5 for better viz, group rest to "Others"
            let finalLabels = [];
            let finalData = [];
            if(sortedAgg.length > 6) {
                let others = 0;
                sortedAgg.forEach((item, idx) => {
                    if(idx < 5) { finalLabels.push(item[0].substring(0,12)+'..'); finalData.push(item[1]); }
                    else { others += item[1]; }
                });
                finalLabels.push('Lainnya'); finalData.push(others);
            } else {
                finalLabels = sortedAgg.map(i => i[0].substring(0,12)+'..');
                finalData = sortedAgg.map(i => i[1]);
            }

            if(charts.portfolioDonut) charts.portfolioDonut.destroy();
            
            const ctx = document.getElementById('portfolioChart');
            if(ctx) {
                charts.portfolioDonut = new Chart(ctx.getContext('2d'), {
                    type: 'doughnut',
                    plugins: [ChartDataLabels],
                    data: {
                        labels: finalLabels,
                        datasets: [{
                            data: finalData,
                            backgroundColor: ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#64748b'],
                            borderColor: '#0f172a',
                            borderWidth: 2,
                            hoverOffset: 5
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '65%',
                        plugins: {
                            legend: { position: 'right', labels: { color: '#cbd5e1', usePointStyle: true, boxWidth: 6, font: {size: 10} } },
                            datalabels: { color: '#fff', font: {weight: 'bold', size: 10}, formatter: (val) => val }
                        }
                    }
                });
            }
        }

        // Mencari nama kolom sesungguhnya di array object JSON berdasarkan kata kunci
        function getColName(rowObj, keywords) {
            if(!rowObj) return null;
            const keys = Object.keys(rowObj);
            for(let key of keys) {
                const lowerKey = key.toLowerCase();
                for(let kw of keywords) {
                    if(lowerKey.includes(kw.toLowerCase())) return key;
                }
            }
            return null;
        }
